<div class="login-wrapper">
  <header class="carousel-logo">
    <div class="img-logo-box">
      <img src="../../../assets/logo-2.png" class="logo-img" loading="lazy" alt="" />
    </div>
  </header>
  <div class="login-box shadow-lg">
    <h2 class="text-center mb-5">تسجيل الدخول</h2>
    <form class="d-flex flex-column gap-4 align-items-center w-100">
      <div class="input-box w-100">
        <div class="input-group pb-2 border-bottom">
          <input type="text" class="form-control bg-transparent border-0 text-black" placeholder="اسم المستخدم" />
          <span class="input-group-text bg-transparent border-0 p-0">
            <i class="fas fa-user main-color"></i>
          </span>
        </div>
      </div>
      <div class="input-box w-100">
        <div class="input-group pb-2 border-bottom">
          <input type="password" class="form-control bg-transparent border-0 text-black" placeholder="كلمة المرور" />
          <span class="input-group-text bg-transparent border-0 p-0">
            <i class="fas fa-key main-color"></i>
          </span>
        </div>
      </div>
      <div class="form-check w-100">
        <input class="form-check-input" type="checkbox" id="remember-me">
        <label class="form-check-label" for="remember-me">
          تذكرنى
        </label>
      </div>

      <button class="btn main-button">تسجيل دخول</button>
    </form>
  </div>
</div>
