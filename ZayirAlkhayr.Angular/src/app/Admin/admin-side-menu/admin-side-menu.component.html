<aside id="admin-side-menu" [class.collapse-side-menu]="isCollapsing">
  <div class="admin-side-menu-content h-100">
    <div class="admin-side-menu-user">
      <div class="side-menu-user-info d-flex flex-column gap-2">
        <div class="d-flex align-items-center gap-2">
          <i class="uil uil-user"></i>
          <div class="fw-bold side-menu-text">سلام هانى</div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <i class="uil uil-calendar-alt"></i>
          <div class="side-menu-text">11/2/2024 11:05 PM</div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <i class="uil uil-envelope"></i>
          <div class="side-menu-text">salam@hany.com</div>
        </div>
      </div>
    </div>
    <hr>
    <div class="admin-side-menu-list">
      <div class="side-menu-list-title side-menu-text">موقع زائر الخير</div>
      <ul class="side-menu-list list-unstyled p-0 m-0">
        <li class="side-menu-list-item">
          <a class="side-menu-list-link" routerLink="./home-slideimage" routerLinkActive="active">
            <i class="uil uil-setting"></i>
            <span class="side-menu-text">الصفحة الرئيسية</span>
          </a>
        </li>
        <li class="side-menu-list-item">
          <a class="side-menu-list-link" routerLink="./activity" routerLinkActive="active">
            <i class="uil uil-setting"></i>
            <span class="side-menu-text">الأنشطة</span>
          </a>
        </li>
        <li class="side-menu-list-item">
          <a class="side-menu-list-link" routerLink="./activity-details" routerLinkActive="active">
            <i class="uil uil-setting"></i>
            <span class="side-menu-text">تفاصيل النشاط</span>
          </a>
        </li>
        <li class="side-menu-list-item">
          <a class="side-menu-list-link" routerLink="./event" routerLinkActive="active">
            <i class="uil uil-setting"></i>
            <span class="side-menu-text">الفعاليات</span>
          </a>
        </li>
        <li class="side-menu-list-item">
          <a class="side-menu-list-link" routerLink="./photo" routerLinkActive="active">
            <i class="uil uil-setting"></i>
            <span class="side-menu-text">الصور</span>
          </a>
        </li>
        <li class="side-menu-list-item">
          <a class="side-menu-list-link" routerLink="./photo-details" routerLinkActive="active">
            <i class="uil uil-setting"></i>
            <span class="side-menu-text">تفاصيل الصور</span>
          </a>
        </li>
        <li class="side-menu-list-item">
          <a class="side-menu-list-link">
            <i class="uil uil-setting"></i>
            <span class="side-menu-text">المتبرعين</span>
          </a>
        </li>
        <li class="side-menu-list-item">
          <a class="side-menu-list-link">
            <i class="uil uil-setting"></i>
            <span class="side-menu-text">تفاصيل المتبرعين</span>
          </a>
        </li>
      </ul>
      <hr>
      <div class="side-menu-list-title side-menu-text">خدمات اجتماعية</div>
      <ul class="side-menu-list list-unstyled p-0 m-0">
        <li class="side-menu-list-item">
          <a class="side-menu-list-link with-sub-menu" [class.expanded]="isCollapsed_1" (click)="collapse.toggle()"
            [attr.aria-expanded]="!isCollapsed_1">
            <i class="uil uil-setting"></i>
            <span class="side-menu-text">الحالات</span>
          </a>
        </li>
        <ul class="list-unstyled m-0 menu-list-collapsed" #collapse="ngbCollapse" [(ngbCollapse)]="isCollapsed_1">
          <li>
            <a class="side-menu-list-link sub-link">
              <i class="uil uil-sliders-v-alt"></i>
              <span class="side-menu-text">حالات عامة</span>
            </a>
          </li>
          <li>
            <a class="side-menu-list-link sub-link">
              <i class="uil uil-sliders-v-alt"></i>
              <span class="side-menu-text">أيتام</span>
            </a>
          </li>
        </ul>
        <li>
          <a class="side-menu-list-link sub-link">
            <i class="uil uil-sliders-v-alt"></i>
            <span class="side-menu-text">دار المغتربين</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</aside>

<div class="admin-side-menu-overlay" [class.show]="isCollapsing" (click)="onCloseSidemenuFromOverlay()"></div>
