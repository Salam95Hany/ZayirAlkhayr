<div class="card">
  <div class="card-header d-flex align-items-center justify-content-between gap-2">
    <div class="d-flex align-items-center">
      <i class="uil uil-user"></i>
      <div>المشرف</div>
      <div class="d-flex align-items-center flex-wrap gap-2">
        <button class="btn main-button d-flex align-items-center gap-2 ms-3"
          (click)="openAddUserModal(AddUserModal,null)">
          <i class="uil uil-plus-circle"></i>
          <span class="navbar-brand m-0">اضافه</span>
        </button>
      </div>
    </div>
    <div>
      <app-admin-pagination [currentPage]="1" [pageSize]="10" [totalPages]="0" [totalCount]="5"></app-admin-pagination>
    </div>
  </div>
  <div class="card-body card-body-h">
    <div class="table-responsive">
      <table class="table table-bordered align-middle table-dark table-hover border shadow-lg bg-white m-0">
        <thead>
          <tr>
            <th>الاسم</th>
            <th>البريد الالكترونى</th>
            <th>رقم التلفون</th>
            <th>تاريخ الدخول</th>
            <th>الحالة</th>
            <th class="text-center">أجراءات</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>تفاصيل 1</td>
            <td>تفاصيل 2</td>
            <td>تفاصيل 3</td>
            <td>تفاصيل 3</td>
            <td>
              <div class="status-tag active">نشط</div>
            </td>
            <td>
              <div class="d-flex align-items-center justify-content-center fs-5 gap-2">
                <i class="uil uil-edit text-primary icon-table-action shadow-sm"></i>
                <i class="uil uil-times-circle text-danger icon-table-action shadow-sm"></i>
                <i class="uil uil-user-check text-info icon-table-action shadow-sm"></i>
              </div>
            </td>
          </tr>
          <tr>
            <td>تفاصيل 1</td>
            <td>تفاصيل 2</td>
            <td>تفاصيل 3</td>
            <td>
              <div class="status-tag inactive">غير نشط</div>
            </td>
            <td>
              <div class="d-flex align-items-center justify-content-center fs-5 gap-2">
                <i class="uil uil-edit text-primary icon-table-action shadow-sm"></i>
                <i class="uil uil-times-circle text-danger icon-table-action shadow-sm"></i>
                <i class="uil uil-user-check text-info icon-table-action shadow-sm"></i>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<ng-template #AddUserModal let-modal>
  <div class="modal-header d-flex align-items-center justify-content-between main-bgcolor text-white">
    <div class="display-7 d-flex align-items-center gap-3">
      <i class="uil uil-focus-add"></i>
      <span>اضافه مستخدم جديد</span>
    </div>
    <i class="fas fa-times cursor-pointer fa-2x modal-close-btn" (click)="modal.dismiss()"></i>
  </div>
  <div class="modal-body gray-bgcolor">
    <div class="bg-white p-3 rounded shadow-sm">
      <form [formGroup]="ItemForm" autocomplete="off">
        <div class="row g-3">
          <div class="col-lg-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="floatingInput_1" placeholder="new-user"
                formControlName="userName" required>
              <label for="floatingInput_1">اسم المستخدم</label>
            </div>
            <div
              *ngIf="ItemForm.controls['userName']?.invalid && (ItemForm.controls['userName']?.dirty || ItemForm.controls['userName']?.touched)"
              class="alert text-danger">
              <div *ngIf="ItemForm.controls['userName'].errors?.['required']">
                هذا الحقل مطلوب
              </div>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="floatingInput_1" placeholder="new-user"
                formControlName="email" required>
              <label for="floatingInput_1">البريد الالكتروني</label>
            </div>
            <div
              *ngIf="ItemForm.controls['email']?.invalid && (ItemForm.controls['email']?.dirty || ItemForm.controls['email']?.touched)"
              class="alert text-danger">
              <div *ngIf="ItemForm.controls['email'].errors?.['required']">
                هذا الحقل مطلوب
              </div>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="floatingInput_1" placeholder="new-user"
                formControlName="phoneNumber" required>
              <label for="floatingInput_1">رقم التلفون</label>
            </div>
            <div
              *ngIf="ItemForm.controls['phoneNumber']?.invalid && (ItemForm.controls['phoneNumber']?.dirty || ItemForm.controls['phoneNumber']?.touched)"
              class="alert text-danger">
              <div *ngIf="ItemForm.controls['phoneNumber'].errors?.['required']">
                هذا الحقل مطلوب
              </div>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="floatingInput_1" placeholder="new-user"
                formControlName="password" required>
              <label for="floatingInput_1">كلمة المرور</label>
            </div>
            <div
              *ngIf="ItemForm.controls['password']?.invalid && (ItemForm.controls['password']?.dirty || ItemForm.controls['password']?.touched)"
              class="alert text-danger">
              <div *ngIf="ItemForm.controls['password'].errors?.['required']">
                هذا الحقل مطلوب
              </div>
            </div>
          </div>
          <div class="col-lg-6">
            <div ngbDropdown class="dropdown-with-search h-100 overflow-hidden" container="body">
              <button
                class="dropdown-with-search-btn btn border h-100 w-100 d-flex align-items-center justify-content-between selector-padding"
                id="dropdownBasic1" ngbDropdownToggle>
                --اختار--
              </button>
              <div class="width-530 py-0 overflow-hidden" ngbDropdownMenu aria-labelledby="dropdownBasic1">
                <!-- <div class="p-2 gray-bgcolor border-bottom">
                  <div class="position-relative">
                    <input type="text" class="form-control form-control-sm" placeholder="بحث..." />
                    <i class="uil uil-search search-icon-input"></i>
                  </div>
                </div> -->
                <ul class="dropdown-list-box list-unstyled max-height-200 overflow-auto px-1 py-1 m-0">
                  <li class="dropdown-item cursor-pointer rounded" *ngFor="let role of Roles">{{role}}</li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
  <div class="modal-footer justify-content-start gap-2">
    <button class="btn main-button d-flex align-items-center gap-2" (click)="AddNewActivity()">
      <i class="uil uil-plus-circle"></i>
      <span>اضافه</span>
    </button>
    <button class="btn btn-danger rounded-25 d-flex align-items-center gap-2" (click)="modal.close()">
      <i class="uil uil-times-circle"></i>
      <span>الغاء</span>
    </button>
  </div>
</ng-template>
