<h3 class="main-color mb-3 display-6">عنوان تفاصيل النشاط</h3>
<p class="fs-5 lh-lg mb-4">
  <span class="main-color fw-bold">يوم التحدي</span> هو مبادرة تم إطلاقها من خلال جمعية رسالة لتقدير أبطال التحدي، وتهدف في الأساس إلى تسليط الضوء عليهم وحقوقهم في المجتمع والتمهيد لدمجهم في المجتمع بشكل طبيعي بدون أي تمييز، والمبادرة تحت رعاية وزارة التضامن الاجتماعي.
</p>
<div class="row gy-4">
  <div class="col-12">
    <swiper [initialSlide]="1" [slidesPerView]="3" [spaceBetween]="30" [navigation]="true" [loop]="true" [lang]="'rtl'"
      [breakpoints]="{
      '0': {
        slidesPerView: 1
      },
      '575': {
        slidesPerView: 1
      },
      '767': {
        slidesPerView: 2
      },
      '1024': {
        slidesPerView: 2
      },
      '1200': {
        slidesPerView: 3
      }
    }">
      <ng-template swiperSlide>
        <div class="khairy-box h-100">
          <div class="kahiry-img">
            <img src="../../../assets/khairy-1.jpg" loading="lazy" alt="khairy-images" />
          </div>
        </div>
      </ng-template>
      <ng-template swiperSlide>
        <div class="khairy-box h-100">
          <div class="kahiry-img">
            <img src="../../../assets/khairy-2.jpg" loading="lazy" alt="khairy-images" />
          </div>
        </div>
      </ng-template>
      <ng-template swiperSlide>
        <div class="khairy-box h-100">
          <div class="kahiry-img">
            <img src="../../../assets/khairy-3.jpg" loading="lazy" alt="khairy-images" />
          </div>
        </div>
      </ng-template>
      <ng-template swiperSlide>
        <div class="khairy-box h-100">
          <div class="kahiry-img">
            <img src="../../../assets/khairy-4.jpg" loading="lazy" alt="khairy-images" />
          </div>
        </div>
      </ng-template>
      <ng-template swiperSlide>
        <div class="khairy-box h-100">
          <div class="kahiry-img">
            <img src="../../../assets/khairy-5.jpg" loading="lazy" alt="khairy-images" />
          </div>
        </div>
      </ng-template>
    </swiper>
  </div>
</div>
